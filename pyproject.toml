[project]
name = "confidence-shocks"
version = "0.1.0"
description = "Does a soccer player's game change after a confidence shock, and which attributes move most?"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kaito N. Hikino" }]
keywords = ["soccer", "football", "sports-analytics", "causal-inference", "event-data"]
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6",
    "statsbombpy>=1.11",
]

[project.scripts]
confshocks = "confidence_shocks.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=3.7",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]
notebooks = [
    "jupyterlab>=4",
    "mplsoccer>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/confidence_shocks"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=confidence_shocks --cov-report=term-missing"
